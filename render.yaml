services:
  - type: web
    name: phi-expert
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PHI_API_TOKEN
        sync: false
      - key: PHI_API_BASE_URL
        sync: false
      - key: PHI_API_KEY
        sync: false
      - key: PHI_MODEL
        sync: false
      - key: PHI_DATA_DIR
        value: /tmp/phi-expert-data
